<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>winemint page</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --mint: #69b53f;
            --kde-blue: #3daee9;
            --xfce-mouse: #2284e6;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Ubuntu', sans-serif;
            background-color: var(--bg);
            color: #333;
            margin: 0;
        }

        header {
            background: white;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--mint);
        }

        .logo { font-size: 32px; font-weight: bold; letter-spacing: -1px; }
        .logo span { color: var(--mint); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 40px 20px;
        }

        .edition-card {
            background: white;
            border-radius: 12px;
            width: 420px; /* Немного расширил для скриншотов */
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #ddd;
            transition: border-color 0.3s ease;
        }

        .edition-card:hover {
            border-color: var(--mint);
        }

        .icon-logo {
            height: 60px;
            width: auto;
            margin-bottom: 15px;
        }

        .screenshot {
            width: 100%;
            height: auto;
            border-radius: 6px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #eee;
        }

        .edition-card h2 { font-size: 24px; margin: 10px 0; }
        
        .kde h2 { color: var(--kde-blue); }
        .xfce h2 { color: var(--xfce-mouse); }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

        .btn {
            padding: 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-torrent { background: var(--mint); color: white; }
        .btn-torrent:hover { background: #589a34; }

        .btn-mirror { background: #f0f0f0; color: #555; }
        .btn-mirror:hover { background: #e5e5e5; }

        .md5 {
            margin-top: 25px;
            font-size: 10px;
            font-family: monospace;
            background: #f4f4f4;
            padding: 8px;
            border-radius: 4px;
            color: #777;
            word-break: break-all;
        }

        footer { text-align: center; padding: 60px; color: #999; font-size: 0.85em; }
    </style>
</head>
<body>

<header>
    <div class="logo">wine<span>mint</span></div>
</header>

<div class="container">
    
    <!-- KDE Edition -->
    <div class="edition-card kde">
        <img src="kde.svg" alt="KDE Logo" class="icon-logo">
        <h2>KDE Plasma Edition</h2>

        <a href="winemintkde.png"><img src="winemintkde.png" alt="Winemint KDE Desktop" class="screenshot"></a>
        
        <div class="btn-group">
            <a href="winemint-0.1-64bit-.iso.torrent" class="btn btn-torrent" download>Download .torrent</a>
            <a href="https://master.dl.sourceforge.net/project/winemint/winemint-0.1-kde-64bit.iso" class="btn btn-mirror">Download .iso</a>
        </div>
        <div class="md5">MD5: e804979a70edee2d06512ea87fc8994b</div>
    </div>

    <div class="edition-card xfce">
        <img src="xfce.svg" alt="XFCE Logo" class="icon-logo">
        <h2>XFCE Edition</h2>
        <a href="winemintxfce.png"><img src="winemintxfce.png" alt="Winemint XFCE Desktop" class="screenshot"></a>
        
        <div class="btn-group">
            <a href="winemint-0.1-kde-64bit-.iso.torrent" class="btn btn-torrent">Download .torrent</a>
            <a href="https://master.dl.sourceforge.net/project/winemint/winemint-0.1-64bit.iso" class="btn btn-mirror">Download .iso</a>
        </div>
        <div class="md5">MD5: e2d39b347e65ce616e3af333685e76bd</div>
    </div>

</div>


</body>
</html>
